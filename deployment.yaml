apiVersion: apps/v1
kind: Deployment
metadata:
  name: noticeboard-deployment
  labels:
    app: noticeboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noticeboard
  template:
    metadata:
      labels:
        app: noticeboard
    spec:
      containers:
      - name: noticeboard
        image: YOUR_DOCKERHUB_USERNAME/noticeboard:latest # Replace with your username
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: noticeboard-service
spec:
  type: NodePort
  selector:
    app: noticeboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Exposes the application on this port
